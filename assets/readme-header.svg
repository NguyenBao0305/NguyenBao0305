<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="45%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#ff8fa3"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-600 0; 600 0; -600 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- khung cửa sổ terminal -->
  <rect x="1.5" y="1.5" width="597" height="147" rx="14"
        fill="#0b0d14" stroke="#ff2d55" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- thanh tiêu đề -->
  <rect x="1.5" y="1.5" width="597" height="38" rx="14" fill="#12141f"/>
  <rect x="1.5" y="26" width="597" height="13.5" fill="#12141f"/>
  <line x1="1.5" y1="39.5" x2="598.5" y2="39.5" stroke="#22242f" stroke-width="1"/>

  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="6" fill="#27c93f"/>

  <text x="300" y="24.5" text-anchor="middle" font-family="Fira Code, Consolas, monospace"
        font-size="12" fill="#6b6f80">README.md</text>

  <!-- nội dung typing -->
  <text x="26" y="92" font-family="Fira Code, Consolas, monospace" font-size="24"
        font-weight="600" fill="url(#textGrad)" filter="url(#glow)">
    &gt;_ Software Engineering Student_
  </text>

  <!-- gạch chân chạy hiệu ứng gõ chữ -->
  <rect x="26" y="102" height="3" rx="1.5" fill="url(#textGrad)" filter="url(#glow)">
    <animate attributeName="width"
      values="0;430;430;0;0" keyTimes="0;0.35;0.75;0.85;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- con trỏ nhấp nháy -->
  <rect x="458" y="72" width="10" height="22" fill="#ff2d55" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="x" values="30;460;460" keyTimes="0;0.75;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>

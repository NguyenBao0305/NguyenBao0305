<svg width="480" height="120" viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="45%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#ff8fa3"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-480 0; 480 0; -480 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="typeClip">
      <rect x="20" y="48" width="0" height="42">
        <animate attributeName="width"
          values="0;340;340;0;0"
          keyTimes="0;0.35;0.75;0.85;1"
          dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- khung cua so terminal -->
  <rect x="1.2" y="1.2" width="477.6" height="117.6" rx="11"
        fill="#0b0d14" stroke="#ff2d55" stroke-opacity="0.45" stroke-width="1.2"/>

  <!-- thanh tieu de -->
  <rect x="1.2" y="1.2" width="477.6" height="30" rx="11" fill="#12141f"/>
  <rect x="1.2" y="20" width="477.6" height="11.2" fill="#12141f"/>
  <line x1="1.2" y1="31.5" x2="478.8" y2="31.5" stroke="#22242f" stroke-width="1"/>

  <circle cx="21" cy="16" r="4.8" fill="#ff5f56"/>
  <circle cx="38.5" cy="16" r="4.8" fill="#ffbd2e"/>
  <circle cx="56" cy="16" r="4.8" fill="#27c93f"/>

  <text x="240" y="19.5" text-anchor="middle" font-family="Fira Code, Consolas, monospace"
        font-size="9.5" fill="#6b6f80">README.md</text>

  <!-- chu gradient, go roi xoa lien tuc -->
  <text x="20" y="74" font-family="Fira Code, Consolas, monospace" font-size="19"
        font-weight="600" fill="url(#textGrad)" filter="url(#glow)" clip-path="url(#typeClip)">
    &gt;_ Software Engineering Student_
  </text>
</svg>

<svg width="420" height="104" viewBox="0 0 420 104" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-420 0; 420 0; -420 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="typeClip">
      <rect x="18" y="40" width="0" height="34">
        <animate attributeName="width"
          values="0;382;382;0;0"
          keyTimes="0;0.35;0.75;0.85;1"
          dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- khung cua so terminal, khong vien do -->
  <rect x="1" y="1" width="418" height="102" rx="10" fill="#0b0d14"/>

  <!-- thanh tieu de -->
  <rect x="1" y="1" width="418" height="26" rx="10" fill="#12141f"/>
  <rect x="1" y="17" width="418" height="10" fill="#12141f"/>
  <line x1="1" y1="27" x2="419" y2="27" stroke="#22242f" stroke-width="1"/>

  <circle cx="18" cy="14" r="4.2" fill="#ff5f56"/>
  <circle cx="33" cy="14" r="4.2" fill="#ffbd2e"/>
  <circle cx="48" cy="14" r="4.2" fill="#27c93f"/>

  <text x="210" y="17.5" text-anchor="middle" font-family="Fira Code, monospace"
        font-size="8.5" fill="#6b6f80">README.md</text>

  <!-- chu gradient xanh neon, go roi xoa lien tuc; textLength dam bao vua khung du font nao -->
  <text x="18" y="63" font-family="Fira Code, monospace" font-size="13"
        font-weight="600" fill="url(#textGrad)" filter="url(#glow)"
        clip-path="url(#typeClip)"
        textLength="382" lengthAdjust="spacingAndGlyphs">&gt;_ Software Engineering Student_</text>
</svg>
